[build]
  command = "if [ -d Assets ]; then mkdir -p public/assets && cp -r Assets/* public/assets/; fi"
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200