<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpecScan · Start Inspection</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-step="1">
    <header class="app-header">
        <div class="brand">
            <span class="badge">SpecScan</span>
            <h1>Airplane Inspection Console</h1>
        </div>
        <div class="step-indicator">
            <span class="step-label">Step 1 of 7</span>
            <span class="step-name">Start Inspection</span>
        </div> 
    </header>

    <main class="shell">
        <section class="card start-card">
            <header class="card-header">
                <h2>Inspection Details</h2>
                <p>Provide the basics so we can stamp the report and segment analysis by airframe.</p>
            </header>
            <form class="form-grid" id="startForm">
                <label class="form-field">
                    <span class="form-label">Tail Number</span>
                    <input type="text" id="tailNumber" name="tailNumber" maxlength="10" required placeholder="e.g. N12345">
                </label>

                <fieldset class="form-field">
                    <legend class="form-label">Inspection Type</legend>
                    <div class="radio-group">
                        <label class="radio">
                            <input type="radio" name="inspectionType" value="Inbound" checked>
                            <span>Inbound</span>
                        </label>
                        <label class="radio">
                            <input type="radio" name="inspectionType" value="Outbound">
                            <span>Outbound</span>
                        </label>
                    </div>
                </fieldset>

                <label class="form-field">
                    <span class="form-label">Department</span>
                    <input type="text" id="department" name="department" placeholder="e.g. Maintenance QA">
                </label>

                <label class="form-field">
                    <span class="form-label">Inspector Name</span>
                    <input type="text" id="inspectorName" name="inspectorName" required placeholder="Your name">
                </label>

                <label class="form-field">
                    <span class="form-label">Started At</span>
                    <input type="text" id="startedAt" name="startedAt" readonly>
                </label>
            </form>

            <footer class="card-footer">
                <button type="button" class="primary" id="startCaptureBtn">Start Photo Capture</button>
            </footer>
        </section>
    </main>

    <script type="module" src="state.js"></script>
    <script type="module" src="start.js"></script>
</body>
</html>
