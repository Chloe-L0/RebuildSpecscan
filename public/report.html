<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpecScan · Final Report</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-step="6">
    <!-- Header -->
    <header class="capture-header">
        <div class="header-content">
            <div class="logo">VERiiO</div>
            <h1 class="header-title">AIRPLANE INSPECTION CONSOLE</h1>
            <div class="profile-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </div>
        </div>
    </header>

    <main class="shell report-page">
        <section class="card report-card">
            <div class="report-header">
                <h2 class="report-title">EXPORT Report</h2>
                <p class="report-subtitle" id="reportTailNumber">Tail --</p>
            </div>

            <!-- Summary Boxes -->
            <div class="report-summary-section">
                <article class="report-summary-box">
                    <h3 class="summary-box-title">AREAS INSPECTED</h3>
                    <div class="summary-box-value" id="areasInspected">1</div>
                    <p class="summary-box-desc">Distinct airframe in this session</p>
                </article>
                <article class="report-summary-box">
                    <h3 class="summary-box-title">TOTAL PHOTOS</h3>
                    <div class="summary-box-value" id="totalPhotos">2</div>
                    <p class="summary-box-desc">Captured and Tagged Across All Areas</p>
                </article>
                <article class="report-summary-box">
                    <h3 class="summary-box-title">DETECTIONS</h3>
                    <div class="summary-box-value" id="totalDetections">1</div>
                    <p class="summary-box-desc">Filtered by confidence and false-positive status.</p>
                </article>
            </div>

            <!-- Export Preferences -->
            <div class="report-preferences">
                <h3 class="preferences-title">EXPORT PREFERENCES</h3>
                <div class="preferences-options">
                    <label class="radio-option">
                        <input type="checkbox" id="thumbnailToggle" checked>
                        <span>Include defect thumbnails in PDF export</span>
                    </label>
                    <label class="radio-option">
                        <input type="checkbox" id="falsePositiveToggle">
                        <span>Include detections flagged as false positives</span>
                    </label>
                    <label class="radio-option">
                        <input type="checkbox" id="allPhotosToggle" checked>
                        <span>Include all captured photos in appendix</span>
                    </label>
                </div>
            </div>

            <footer class="report-footer">
                <button class="report-back-btn" id="backToResultsBtn">PREVIOUS STEP</button>
                <button class="report-submit-btn" id="submitInspectionBtn">SUBMIT INSPECTION</button>
            </footer>
        </section>
    </main>

    <script type="module" src="state.js"></script>
    <script type="module" src="report.js"></script>
</body>
</html>
