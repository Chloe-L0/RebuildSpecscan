<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpecScan · Export Report</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
        }
    }
    </script>
</head>
<body data-step="5">
    <header class="capture-header">
        <div class="header-content">
            <div class="logo" id="logoBtn" style="cursor: pointer;" title="Return to start">VERiiO</div>
            <h1 class="header-title">AIRPLANE INSPECTION CONSOLE</h1>
            <div class="header-right">
                <div class="step-indicator">
                    <span class="step-label">Step 5 / 6</span>
                    <span class="step-name">Export Report</span>
                </div>
                <div class="profile-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
            </div>
        </div>
    </header>

    <main class="shell report-page">
        <section class="card report-card report-export-layout">
            <div class="report-header content-top-bar">
                <div>
                    <h2 class="report-title">EXPORT REPORT</h2>
                    <p class="report-subtitle" id="reportTailNumber">Tail --</p>
                </div>
                <div class="content-actions">
                    <button class="footer-btn previous-btn" id="backToResultsBtn">PREVIOUS STEP</button>
                    <button class="footer-btn continue-btn" id="submitInspectionBtn">SUBMIT INSPECTION</button>
                </div>
            </div>

            <div class="report-split">
                <!-- LEFT: PDF Preview (60%) -->
                <div class="report-preview-column">
                    <div class="report-preview-toolbar">
                        <span class="report-preview-pagination" id="reportPreviewPagination">Page 1 of 1</span>
                        <span class="report-preview-pending hidden" id="reportPreviewPending">Preview will update…</span>
                    </div>
                    <div class="report-preview-wrap" id="reportPreviewWrap">
                        <div class="report-preview-loading hidden" id="reportPreviewLoading">Generating preview…</div>
                        <div class="report-preview-pages" id="reportPreviewPages"></div>
                    </div>
                </div>

                <!-- RIGHT: Editor panel (40%) -->
                <div class="report-editor-column">
                    <div class="report-editor-summary" id="reportEditorSummary">
                        <h3 class="report-editor-section-title">INSPECTION SUMMARY</h3>
                        <div class="report-editor-meta" id="reportEditorMeta">--</div>
                    </div>

                    <div class="report-editor-findings">
                        <div class="report-editor-findings-header">
                            <h3 class="report-editor-section-title">FINDINGS</h3>
                        </div>
                        <div class="report-findings-bulk-bar hidden" id="reportFindingsBulkBar">
                            <span class="report-findings-bulk-count" id="reportFindingsBulkCount">0 selected</span>
                            <button type="button" class="report-findings-bulk-btn" id="reportBulkFlagBtn" title="Flag all selected as critical">
                                <span class="report-finding-icon" aria-hidden="true" data-icon="flag"></span>
                                <span>Flag All</span>
                            </button>
                            <button type="button" class="report-findings-bulk-btn report-findings-bulk-delete" id="reportBulkDeleteBtn" title="Delete all selected">
                                <span class="report-finding-icon" aria-hidden="true" data-icon="trash"></span>
                                <span>Delete All</span>
                            </button>
                            <button type="button" class="report-findings-bulk-btn" id="reportBulkClearBtn" title="Clear selection">
                                <span>Clear Selection</span>
                            </button>
                        </div>
                        <div class="report-findings-list" id="reportFindingsList"></div>
                    </div>
                    <div class="report-findings-toast hidden" id="reportFindingsToast" role="status">
                        <span class="report-findings-toast-text">Finding deleted.</span>
                        <button type="button" class="report-findings-toast-undo" id="reportFindingsToastUndo">Undo</button>
                    </div>

                    <div class="report-editor-preferences">
                        <h3 class="report-editor-section-title">EXPORT OPTIONS</h3>
                        <div class="report-preferences-inline">
                            <label class="radio-option"><input type="checkbox" id="thumbnailToggle" checked><span>Include defect thumbnails</span></label>
                            <label class="radio-option"><input type="checkbox" id="falsePositiveToggle"><span>Include false positives</span></label>
                            <label class="radio-option"><input type="checkbox" id="allPhotosToggle" checked><span>Include all photos in appendix</span></label>
                            <label class="radio-option"><input type="checkbox" id="flaggedImagesToggle"><span>Include flagged images</span></label>
                            <label class="radio-option"><input type="checkbox" id="flaggedImageNotesToggle"><span>Include notes for flagged images</span></label>
                        </div>
                    </div>

                    <div class="report-editor-notes">
                        <h3 class="report-editor-section-title">ADD NOTES</h3>
                        <textarea id="reportNotes" class="report-notes-field report-notes-inline" placeholder="Inspection notes, observations, comments…" rows="3"></textarea>
                    </div>

                    <div class="report-editor-flagged-section" id="flaggedImagesNotesSection">
                        <h3 class="report-editor-section-title">FLAGGED IMAGES NOTES</h3>
                        <div class="flagged-images-list report-flagged-inline" id="flaggedImagesList"></div>
                    </div>

                    <div class="report-editor-actions">
                        <button type="button" class="report-generate-btn" id="generateFinalReportBtn">GENERATE FINAL REPORT</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Hidden 3D viewer for technical reference views in PDF -->
    <div id="report3DViewer" style="position: absolute; width: 500px; height: 500px; left: -9999px; top: -9999px; visibility: hidden;"></div>

    <!-- Finding detail modal (full-resolution photo + bbox) -->
    <div class="finding-detail-modal hidden" id="findingDetailModal" role="dialog" aria-modal="true" aria-labelledby="findingDetailModalTitle">
        <div class="finding-detail-modal-backdrop" id="findingDetailModalBackdrop"></div>
        <div class="finding-detail-modal-box">
            <button type="button" class="finding-detail-modal-close" id="findingDetailModalClose" aria-label="Close">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <h2 class="finding-detail-modal-title" id="findingDetailModalTitle">Finding detail</h2>
            <div class="finding-detail-modal-meta" id="findingDetailModalMeta"></div>
            <div class="finding-detail-modal-image-wrap" id="findingDetailModalImageWrap">
                <img class="finding-detail-modal-image" id="findingDetailModalImage" alt="" />
                <div class="finding-detail-modal-overlay" id="findingDetailModalOverlay"></div>
            </div>
        </div>
    </div>

    <script type="module" src="state.js"></script>
    <script type="module" src="report.js"></script>
    <script type="module" src="report-preview.js"></script>
    <script type="module" src="report-3d-viewer.js"></script>
</body>
</html>
