<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpecScan · Tag Photos</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body data-step="4">
    <!-- Header -->
    <header class="capture-header">
        <div class="header-content">
            <div class="logo">VERiiO</div>
            <h1 class="header-title">AIRPLANE INSPECTION CONSOLE</h1>
            <div class="profile-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </div>
        </div>
    </header>

    <main class="shell tag-page">
        <section class="card tag-card">
            <div class="tag-header">
                <div class="tag-title-section">
                    <h2 class="tag-title">TAG YOUR PHOTOS</h2>
                    <p class="tag-subtitle">Link your photos to the location they are found on the aircraft.</p>
                </div>
            </div>

            <div class="tag-content-grid">
                <aside class="tag-assign-area">
                    <h3 class="tag-section-title">ASSIGN AREA</h3>
                    <div class="hotspot-toolbar" id="hotspotToolbar">
                        <button type="button" class="area-hotspot" data-area="FWD Fuselage">FWD Fuselage</button>
                        <button type="button" class="area-hotspot" data-area="MID Fuselage">MID Fuselage</button>
                        <button type="button" class="area-hotspot" data-area="Wings">Wings</button>
                        <button type="button" class="area-hotspot" data-area="AFT Fuselage">AFT Fuselage</button>
                        <button type="button" class="area-hotspot" data-area="Engines">Engines</button>
                        <button type="button" class="area-hotspot" data-area="Vertical Stabilizer">Vertical Stabilizer</button>
                        <button type="button" class="area-hotspot" data-area="Horizontal Stabilizer">Horizontal Stabilizer</button>
                    </div>
                    <div class="tag-selection-controls">
                        <button class="tag-select-btn" id="selectAllBtn">Select all Untagged</button>
                        <button class="tag-clear-btn" id="clearSelectionBtn">Clear Selection</button>
                        <div class="tag-photo-count" id="selectionMeta">0 photos detected</div>
                    </div>
                    <div id="viewerShell" class="viewer-shell tag-viewer">
                        <model-viewer
                            id="areaViewer"
                            class="plane-viewer area-viewer"
                            src="/assets/plane.glb"
                            camera-controls
                            interaction-prompt="none"
                            auto-rotate="false"
                            exposure="1.0"
                            shadow-intensity="0.25"
                            camera-orbit="45deg 75deg 10m"
                            min-camera-orbit="auto 35deg 100m"
                            max-camera-orbit="auto 100deg 130m"
                            field-of-view="5deg"
                            interpolation-decay="20"
                            tone-mapping="neutral"
                            ar="false">
                        </model-viewer>
                        <div id="hotspotLayer" class="overlay-layer" dir="ltr"></div>
                    </div>
                </aside>

                <div class="tag-image-bank">
                    <div class="tag-image-bank-header">
                        <h3 class="tag-section-title">IMAGE BANK</h3>
                    </div>
                    <div class="select-grid" id="tagGrid"></div>
                    <div class="empty-state hidden" id="emptyTagState">
                        <p>No photos available.</p>
                        <small>Return to capture to add imagery before tagging.</small>
                    </div>
                </div>
            </div>

            <footer class="tag-footer">
                <button class="tag-back-btn" id="backBtn">PREVIOUS STEP</button>
                <button class="tag-continue-btn" id="nextBtn" disabled>CONTINUE TO ORGANIZE</button>
            </footer>
        </section>
    </main>

    <script type="module" src="state.js"></script>
    <script type="module" src="tag.js"></script>
</body>
</html>
