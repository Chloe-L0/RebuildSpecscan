<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airplane Inspection · Success</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <small>SpecScan</small>
        <h1>Airplane Inspection Console</h1>
        <p>Guide a technician from preparation through reporting while maintaining visual traceability for every aircraft inspection.</p>
    </header>

    <main>
        <div class="page-shell">
            <section class="success-card">
                <div class="success-icon" aria-hidden="true"></div>
                <div>
                    <h2>Submission Complete</h2>
                    <p class="supporting" id="successDetails">Report submitted.</p>
                </div>
                <div class="page-actions">
                    <button class="btn ghost" id="returnHomeBtn" type="button">Return to Home</button>
                    <button class="btn primary" id="startNewBtn" type="button">Start New Inspection</button>
                </div>
            </section>
        </div>
    </main>

    <script src="success.js" type="module"></script>
</body>
</html>
