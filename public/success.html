<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpecScan · Submission Success</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-step="6">
    <!-- Header -->
    <header class="capture-header">
        <div class="header-content">
            <div class="logo" id="logoBtn" style="cursor: pointer;" title="Return to start">VERiiO</div>
            <h1 class="header-title">AIRPLANE INSPECTION CONSOLE</h1>
            <div class="header-right">
                <div class="step-indicator">
                    <span class="step-label">Step 6 / 6</span>
                    <span class="step-name">Submission Success</span>
                </div>
                <div class="profile-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
            </div>
        </div>
    </header>

    <main class="shell">
        <section class="success-hero">
            <div class="success-icon">✓</div>
            <h2>Inspection Submitted</h2>
            <p class="muted">Your report has been archived. Share the reference ID below with maintenance operations.</p>
            <div class="summary-stat" id="reportId">---</div>
            <div class="muted" id="successMeta"></div>
            <div class="success-actions">
                <button class="primary" id="downloadPdfBtn">Download PDF Report</button>
                <button class="secondary" id="backToReportBtn">Back to Export Settings</button>
                <button class="secondary" id="newInspectionBtn">Start New Inspection</button>
            </div>
        </section>
    </main>

    <!-- Hidden 3D viewer container for PDF generation -->
    <div id="report3DViewer" style="position: absolute; width: 500px; height: 500px; left: -9999px; top: -9999px; visibility: hidden;"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="state.js"></script>
    <script type="module" src="report-3d-viewer.js"></script>
    <script type="module" src="success.js"></script>
</body>
</html>
